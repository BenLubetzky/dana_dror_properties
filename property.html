<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">  <!-- remove when the site goes live for real -->
  <title>DanaDrorProperties</title>
  <script src="js/lang-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="listings">
  <div id="site-header"></div>

  <main class="container" id="property"></main>

  <section class="section--tight" id="similar-wrap" style="padding-bottom: 80px">
    <div class="container">
      <div class="panel">
        <div class="section-head">
          <h2><span data-lang="he">נכסים נוספים באותו תקציב</span><span data-lang="en">More in this budget</span></h2>
          <a class="link-underline" id="similar-all" href="listings.html"><span data-lang="he">לכל הנכסים בטווח</span><span data-lang="en">See all in this range</span></a>
        </div>
        <div class="cards" id="similar"></div>
      </div>
    </div>
  </section>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
    <img alt="">
    <button class="lightbox__btn lightbox__close" data-lb="close" aria-label="Close"></button>
    <button class="lightbox__btn lightbox__prev" data-lb="-1" aria-label="Previous"></button>
    <button class="lightbox__btn lightbox__next" data-lb="1" aria-label="Next"></button>
    <div class="lightbox__count"></div>
  </div>

  <div id="site-footer"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/properties.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/property.js"></script>
</body>
</html>
